<!doctype html><html><head><meta charset="utf-8">
<!-- Fast LinkedIn video, 1080x1350 (4:5), frame-driven: setT(seconds) draws exactly one frame, render.py films it.
     Rules: a cut every 1.5-3 s, something moves in every frame, the "comment KEYWORD" band stays on screen the whole time.
     Scene types: punch, count, list, shot, locked, cta (see knowledge/lead-magnet-playbook.md). -->
<script>/*DATA*/</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg2);font-family:var(--fb),sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.blob{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(120px);opacity:.55}
#b1{background:var(--accent)}#b2{background:var(--kw);opacity:.35}
#cam{position:absolute;left:0;top:0;width:1080px;height:1170px;overflow:hidden}
.sc{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:120px 70px 40px}
#logo{position:absolute;left:60px;top:44px;height:46px;z-index:5;display:flex;align-items:center}
#logo img{height:46px;background:#fff;border-radius:12px;padding:6px 12px}
#logo span{font-family:var(--ft);font-weight:700;font-size:32px}
#band{position:absolute;left:0;right:0;bottom:0;height:180px;background:var(--band);display:flex;align-items:center;justify-content:center;gap:26px;z-index:6}
#band .a{font-family:var(--ft);font-weight:700;font-size:52px}
#band .k{font-family:var(--ft);font-weight:800;font-size:96px;color:var(--kw);display:inline-block}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:7;pointer-events:none}
/* punch */
.words{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px 26px;max-width:960px}
.w{font-family:var(--ft);font-weight:800;font-size:112px;line-height:1.02;letter-spacing:-.02em;display:inline-block;opacity:0}
.w.on{color:var(--kw)}
/* count */
.big{font-family:var(--ft);font-weight:800;font-size:250px;line-height:1;letter-spacing:-.03em}
.lab{font-family:var(--ft);font-weight:600;font-size:56px;text-align:center;margin-top:20px;max-width:900px;line-height:1.1}
.bar{width:800px;height:16px;border-radius:8px;background:rgba(255,255,255,.15);margin-top:50px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kw);width:0}
/* list */
.lt{font-family:var(--ft);font-weight:800;font-size:72px;margin-bottom:40px;align-self:flex-start;letter-spacing:-.01em}
.it{align-self:stretch;background:#fff;color:var(--ink);border-radius:22px;padding:26px 32px;margin-bottom:18px;font-family:var(--ft);font-weight:700;font-size:44px;display:flex;align-items:center;gap:20px;opacity:0}
.it b{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
/* shot */
.cap{font-family:var(--ft);font-weight:800;font-size:64px;text-align:center;margin-bottom:34px;line-height:1.05;max-width:940px}
.frame{width:940px;height:700px;border-radius:20px;background:#fff;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.frame .bar2{height:44px;background:#EEF0F5;display:flex;align-items:center;padding:0 16px;gap:8px}
.frame .bar2 i{width:13px;height:13px;border-radius:50%;background:#D5D8E0}
.frame .img{position:absolute;left:0;top:44px;right:0;bottom:0;overflow:hidden}
.frame .img img{width:100%;transform-origin:30% 30%}
.mock{padding:28px;color:var(--ink)}
.mock .row{height:62px;border-radius:12px;background:#F3F5FA;margin-bottom:14px;display:flex;align-items:center;padding:0 20px;gap:16px;font-size:26px;font-weight:600;opacity:0}
.mock .row s{text-decoration:none;margin-left:auto;padding:6px 14px;border-radius:100px;font-size:20px;font-weight:700}
.hl{position:absolute;border:5px solid var(--kw);border-radius:14px;opacity:0;box-shadow:0 0 0 2000px rgba(5,7,15,.0)}
.cur{position:absolute;width:44px;height:44px;z-index:3}
.ph{position:absolute;right:20px;bottom:16px;font-size:18px;color:#9aa0b4;font-weight:600}
/* locked */
.docs{position:relative;width:900px;height:700px}
.doc{position:absolute;left:150px;top:40px;width:600px;height:620px;background:#fff;border-radius:24px;padding:40px;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.doc h4{font-family:var(--ft);font-weight:800;font-size:40px;margin-bottom:24px}
.doc p{height:20px;border-radius:10px;background:var(--soft);margin-bottom:18px}
.lockp{position:absolute;left:50%;top:300px;background:var(--band);color:#fff;border-radius:100px;padding:24px 44px;font-family:var(--ft);font-weight:800;font-size:46px;white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.5)}
/* cta */
.c1{font-family:var(--ft);font-weight:800;font-size:110px}
.c2{font-family:var(--ft);font-weight:800;font-size:250px;color:var(--kw);line-height:1;margin:10px 0}
.c3{font-family:var(--ft);font-weight:700;font-size:64px;opacity:.9}
</style></head><body>
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div></div>
<div id="cam"></div>
<div id="logo"></div>
<div id="band"><span class="a">comment</span><span class="k" id="kw"></span><span class="a">to get access</span></div>
<div id="flash"></div>
<script>
const D = window.DATA, B = D.brand, C = B.colors;
const r = document.documentElement.style;
r.setProperty('--bg1', C.bg_top); r.setProperty('--bg2', C.bg_bottom); r.setProperty('--accent', C.accent);
r.setProperty('--soft', C.accent_soft); r.setProperty('--ink', C.ink); r.setProperty('--band', C.band); r.setProperty('--kw', C.keyword);
r.setProperty('--ft', `'${B.fonts.title}'`); r.setProperty('--fb', `'${B.fonts.body}'`);
const l = document.createElement('link'); l.rel = 'stylesheet';
l.href = `https://fonts.googleapis.com/css2?family=${B.fonts.title.replace(/ /g,'+')}:wght@500;600;700;800&family=${B.fonts.body.replace(/ /g,'+')}:wght@400;500;600;700&display=block`;
const fontsLoaded = new Promise(r => { l.onload = l.onerror = r; }); document.head.appendChild(l);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
document.getElementById('logo').innerHTML = B.logo ? `<img src="${B.logo}">` : `<span>${esc(B.name)}</span>`;
document.getElementById('kw').textContent = D.keyword;

// easing
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = x => 1 - Math.pow(1 - cl(x), 3);
const eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * cl(x));
const eBack = x => { x = cl(x); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const prog = (t, a, d) => cl((t - a) / d);

const TR = 0.18; // whip transition length
const scenes = (D.video?.scenes || []).map(s => ({ ...s, dur: s.dur || 2 }));
let acc = 0; scenes.forEach(s => { s.start = acc; acc += s.dur; });
window.DUR = acc;
const cam = document.getElementById('cam');
let shotIdx = 0;

const build = {
  punch(s, el) {
    el.innerHTML = `<div class="words">${s.words.split(' ').map(w => `<span class="w">${esc(w)}</span>`).join('')}</div>`;
  },
  count(s, el) {
    el.innerHTML = `<div class="big">0</div><div class="lab">${esc(s.label || '')}</div><div class="bar"><i></i></div>`;
  },
  list(s, el) {
    el.style.justifyContent = 'flex-start'; el.style.paddingTop = '150px';
    el.innerHTML = `<div class="lt">${esc(s.title || '')}</div>` + s.items.map((x, i) => `<div class="it"><b>✓</b>${esc(x)}</div>`).join('');
  },
  shot(s, el) {
    const src = s.image || B.screenshots[shotIdx++ % Math.max(1, B.screenshots.length)];
    const inner = src ? `<div class="img"><img src="${src}"></div>`
      : `<div class="img mock">${['Acme Inc · 14 states', 'Northwind · 9 states', 'Globex · 22 states', 'Initech · 6 states', 'Umbrella · 31 states', 'Hooli · 11 states', 'Vandelay · 4 states'].map((n, i) =>
          `<div class="row">${n}<s style="background:${i % 3 ? 'var(--soft)' : '#FFE1E1'};color:${i % 3 ? 'var(--accent)' : '#B42318'}">${i % 3 ? 'compliant' : 'exposed'}</s></div>`).join('')}<div class="ph">placeholder · your screenshot goes in brand/brand.json</div></div>`;
    el.innerHTML = `<div class="cap">${esc(s.caption || '')}</div><div class="frame"><div class="bar2"><i></i><i></i><i></i></div>${inner}<div class="hl"></div><svg class="cur" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#0B1020" stroke="#fff" stroke-width="1.5"/></svg></div>`;
  },
  locked(s, el) {
    const parts = (D.locked && D.locked.length ? D.locked : ['Step 4', 'Step 5', 'Full table']).slice(0, 3);
    el.innerHTML = `<div class="cap">${esc(s.title || 'the full playbook')}</div><div class="docs">${parts.map(p => `<div class="doc"><h4>${esc(p)}</h4>${'<p></p>'.repeat(9)}</div>`).join('')}<div class="lockp">🔒 locked</div></div>`;
  },
  cta(s, el) {
    el.innerHTML = `<div class="c1">comment</div><div class="c2">${esc(D.keyword)}</div><div class="c3">${esc(s.line || 'to get the full playbook')}</div>`;
  },
};

const draw = {
  punch(s, el, t) {
    const ws = $$('.w', el), n = ws.length, step = Math.min(0.24, (s.dur - 0.5) / n);
    ws.forEach((w, i) => {
      const p = prog(t, 0.08 + i * step, 0.16);
      w.style.opacity = p > 0 ? 1 : 0;
      w.style.transform = `scale(${2.4 - 1.4 * eBack(p)}) rotate(${(1 - eOut(p)) * (i % 2 ? 6 : -6)}deg)`;
      w.classList.toggle('on', p > 0 && t < 0.08 + (i + 1) * step);
    });
    const z = 1 + t * 0.04; $('.words', el).style.transform = `scale(${z})`;
  },
  count(s, el, t) {
    const p = eExpo(prog(t, 0.1, 0.9));
    $('.big', el).textContent = Math.round(s.to * p).toLocaleString('en-US') + (s.suffix || '');
    $('.big', el).style.transform = `scale(${0.7 + 0.3 * eBack(prog(t, 0, 0.35))}) translateY(${(1 - eOut(prog(t, 0, .3))) * 80}px)`;
    const lp = eOut(prog(t, 0.25, 0.3)); $('.lab', el).style.opacity = lp; $('.lab', el).style.transform = `translateY(${(1 - lp) * 60}px)`;
    $('.bar i', el).style.width = (p * 100) + '%';
  },
  list(s, el, t) {
    const its = $$('.it', el), step = Math.min(0.42, (s.dur - 0.6) / its.length);
    const tp = eOut(prog(t, 0, 0.25)); $('.lt', el).style.transform = `translateX(${(1 - tp) * -300}px)`; $('.lt', el).style.opacity = tp;
    its.forEach((it, i) => {
      const p = prog(t, 0.2 + i * step, 0.22);
      it.style.opacity = p > 0 ? 1 : 0;
      it.style.transform = `translateX(${(1 - eBack(p)) * (i % 2 ? -700 : 700)}px) rotate(${(1 - eOut(p)) * (i % 2 ? -4 : 4)}deg)`;
      $('b', it).style.transform = `scale(${eBack(prog(t, 0.32 + i * step, 0.2))})`;
    });
  },
  shot(s, el, t) {
    const cp = eOut(prog(t, 0, 0.25)); $('.cap', el).style.opacity = cp; $('.cap', el).style.transform = `translateY(${(1 - cp) * -50}px)`;
    const fr = $('.frame', el), fp = eBack(prog(t, 0.05, 0.35));
    fr.style.transform = `scale(${0.6 + 0.4 * fp}) rotate(${(1 - fp) * -5}deg)`;
    const img = $('.img img', el);
    if (img) img.style.transform = `scale(${1 + 0.35 * eOut(prog(t, 0.4, s.dur - 0.5))}) translate(${-4 * eOut(prog(t, .4, s.dur))}%, ${-6 * eOut(prog(t, .4, s.dur))}%)`;
    $$('.row', el).forEach((rw, i) => { const p = prog(t, 0.3 + i * 0.12, 0.15); rw.style.opacity = p; rw.style.transform = `translateX(${(1 - eOut(p)) * 120}px)`; });
    const hl = $('.hl', el), hp = eBack(prog(t, s.dur * 0.55, 0.25));
    Object.assign(hl.style, { left: '22px', top: (44 + 28 + 76 * 2 - 6) + 'px', width: '896px', height: '74px', opacity: hp > 0 ? 1 : 0, transform: `scale(${1.3 - .3 * hp})` });
    const cu = $('.cur', el), mp = eOut(prog(t, 0.3, s.dur * 0.55 - 0.3));
    cu.style.left = (820 - 420 * mp) + 'px'; cu.style.top = (640 - 400 * mp) + 'px';
    cu.style.transform = `scale(${t > s.dur * 0.55 && t < s.dur * 0.55 + 0.12 ? 0.8 : 1})`;
  },
  locked(s, el, t) {
    const cp = eOut(prog(t, 0, 0.2)); $('.cap', el).style.opacity = cp;
    $$('.doc', el).forEach((d, i) => {
      const p = eBack(prog(t, 0.05 + i * 0.12, 0.3)), rot = [-12, 3, 14][i], dx = [-170, 0, 170][i];
      d.style.transform = `translate(${dx * p}px, ${(1 - p) * 900}px) rotate(${rot * p}deg)`;
      d.style.filter = `blur(${Math.min(7, 7 * prog(t, 0.5, 0.5))}px)`;
    });
    const lp = eBack(prog(t, 0.7, 0.3)), shake = t > 1 ? Math.sin(t * 60) * 6 * Math.max(0, 1.3 - t) : 0;
    $('.lockp', el).style.transform = `translate(calc(-50% + ${shake}px), ${(1 - lp) * -500}px) scale(${0.6 + 0.4 * lp})`;
  },
  cta(s, el, t) {
    const a = eBack(prog(t, 0, 0.25)), b = eBack(prog(t, 0.15, 0.3)), c = eOut(prog(t, 0.35, 0.3));
    $('.c1', el).style.transform = `scale(${a})`;
    $('.c2', el).style.transform = `scale(${b * (1 + 0.06 * Math.sin(t * 9))}) rotate(${Math.sin(t * 4) * 2}deg)`;
    $('.c3', el).style.opacity = c; $('.c3', el).style.transform = `translateY(${(1 - c) * 50}px)`;
  },
};

scenes.forEach(s => {
  const el = document.createElement('div'); el.className = 'sc'; cam.appendChild(el);
  (build[s.type] || build.punch)(s, el); s.el = el;
});

window.setT = function (T) {
  const i = Math.max(0, scenes.findIndex(s => T >= s.start && T < s.start + s.dur) === -1 ? scenes.length - 1 : scenes.findIndex(s => T >= s.start && T < s.start + s.dur));
  scenes.forEach((s, j) => s.el.style.display = 'none');
  const s = scenes[i], t = T - s.start;
  s.el.style.display = 'flex';
  // whip in: new scene slides from the right with motion blur, previous one leaves to the left
  const w = prog(t, 0, TR);
  if (i > 0 && w < 1) {
    const prev = scenes[i - 1]; prev.el.style.display = 'flex';
    (draw[prev.type] || draw.punch)(prev, prev.el, prev.dur);
    prev.el.style.transform = `translateX(${-eOut(w) * 1080}px)`; prev.el.style.filter = `blur(${12 * w}px)`;
  }
  s.el.style.transform = i > 0 ? `translateX(${(1 - eOut(w)) * 1080}px)` : 'none';
  s.el.style.filter = i > 0 && w < 1 ? `blur(${12 * (1 - w)}px)` : 'none';
  (draw[s.type] || draw.punch)(s, s.el, t);
  // camera punch + shake at every cut
  const k = Math.max(0, 1 - t / 0.35);
  cam.style.transform = `scale(${1 + 0.05 * k}) translate(${Math.sin(T * 70) * 7 * k}px, ${Math.cos(T * 55) * 7 * k}px)`;
  document.getElementById('flash').style.opacity = i > 0 ? Math.max(0, 0.35 - t * 3) : 0;
  // living background
  document.getElementById('b1').style.transform = `translate(${-200 + Math.sin(T * 0.9) * 300}px, ${-250 + Math.cos(T * 0.7) * 200}px)`;
  document.getElementById('b2').style.transform = `translate(${500 + Math.cos(T * 0.8) * 250}px, ${600 + Math.sin(T * 1.1) * 200}px)`;
  // keyword band: hidden on the CTA scene, pulses on every cut otherwise
  const band = document.getElementById('band');
  band.style.transform = s.type === 'cta' ? `translateY(${eOut(prog(t, 0, .2)) * 200}px)` : 'none';
  document.getElementById('kw').style.transform = `scale(${1 + 0.18 * Math.max(0, 1 - t / 0.25)})`;
};

fontsLoaded.then(() => document.fonts.ready).then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r))))
  .then(() => { setT(0); setTimeout(() => window.READY = true, 400); });
</script></body></html>
